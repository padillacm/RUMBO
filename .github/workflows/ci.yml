# CI of the RUMBO framework. Dogfooding: the same sensors the generated harness has.
name: ci

on:
  push:
    branches: ["**"]   # tags are release.yml's job
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # The CLI is stdlib-only and promises Python >= 3.11 on Linux and macOS.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python: "3.12"
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - run: make check

  sensor:
    # Anti-cheat sensor on the framework's own tests (the canonical copy every project gets).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - name: Tests not weakened
        env:
          RUMBO_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: uv run rumbo check-tests --strict

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  e2e:
    # Mounts real projects with `rumbo init` and requires `make check` to be green in each.
    runs-on: ubuntu-latest
    needs: check
    strategy:
      fail-fast: false
      matrix:
        flags:
          - "--no-llm --rigor prototype"
          - "--no-llm --rigor mvp"
          - "--llm --provider anthropic --rigor mvp"
          - "--llm --provider claude-code --rigor mvp"
          - "--llm --provider openai --rigor production"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - run: scripts/e2e.sh "${{ matrix.flags }}"
