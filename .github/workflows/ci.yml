name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - run: make check

  e2e:
    # Monta proyectos reales con `rumbo init` y exige `make check` en verde en cada uno.
    runs-on: ubuntu-latest
    needs: check
    strategy:
      fail-fast: false
      matrix:
        flags:
          - "--no-llm --rigor prototipo"
          - "--no-llm --rigor mvp"
          - "--llm --proveedor anthropic --rigor mvp"
          - "--llm --proveedor openai --rigor produccion"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - run: scripts/e2e.sh "${{ matrix.flags }}"
