# Hooks RUMBO: los mismos sensores para humano y agente.
# `rumbo init` ejecuta `pre-commit autoupdate` para usar las últimas versiones estables.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml
  - repo: local
    hooks:
      - id: lint-imports
        name: lint-imports (contratos de arquitectura)
        entry: uv run lint-imports
        language: system
        pass_filenames: false
        types: [python]
