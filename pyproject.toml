[project]
name = "rumbo"
version = "0.1.0"
description = "RUMBO: framework de punta a punta para construir software con agentes de IA (ANCLA como núcleo)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []  # Solo stdlib: el CLI no debe arrastrar dependencias a los proyectos.

[project.scripts]
rumbo = "rumbo.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rumbo"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["src/rumbo/templates"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "RUF"]
allowed-confusables = ["–"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607"]
"src/rumbo/sensors/**" = ["S603", "S607"]
"src/rumbo/cli.py" = ["S603", "S607"]
"src/rumbo/scaffold.py" = ["S603", "S607"]
"src/rumbo/gates.py" = ["S603", "S607"]

[tool.pyright]
include = ["src", "tests"]
exclude = ["src/rumbo/templates"]
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.hatch.build.targets.wheel.force-include]
"RUMBO.md" = "rumbo/templates/RUMBO.md"
