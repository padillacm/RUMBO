[project]
name = "rumbo"
version = "0.3.0"
description = "RUMBO: an end-to-end framework for building software with AI coding agents (ANCLA at its core)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []  # standard library only: the CLI must not drag dependencies into projects
keywords = ["ai-agents", "harness", "software-engineering", "claude-code", "evals"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/padillacm/RUMBO"
Changelog = "https://github.com/padillacm/RUMBO/blob/main/CHANGELOG.md"

[project.scripts]
rumbo = "rumbo.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rumbo"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["src/rumbo/templates"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "RUF"]
allowed-confusables = ["–", "−"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607"]
"scripts/**" = ["S603", "S607"]
"src/rumbo/sensors/**" = ["S603", "S607"]
"src/rumbo/cli.py" = ["S603", "S607"]
"src/rumbo/scaffold.py" = ["S603", "S607"]
"src/rumbo/tour.py" = ["S603", "S607"]
"src/rumbo/gates.py" = ["S603", "S607"]
"src/rumbo/metrics.py" = ["S603", "S607"]

[tool.pyright]
include = ["src", "tests"]
exclude = ["src/rumbo/templates"]
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.hatch.build.targets.wheel.force-include]
"RUMBO.md" = "rumbo/templates/RUMBO.md"
